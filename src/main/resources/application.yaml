server:
  port: ${PORT:8086}

spring:
  application:
    name: ms-andesstay-rabbit-admin

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:andesstay}
    password: ${RABBITMQ_PASSWORD:andesstay_dev}
    virtual-host: /
    connection-timeout: 5s

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${AZURE_ISSUER_URI:https://login.microsoftonline.com/4fe52189-087c-4613-8660-500431cc0eb9/v2.0}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

andesstay:
  rabbit-admin:
    # Recursos del sistema que la API NO permite eliminar,
    # porque los microservicios dejarían de funcionar.
    protected-names:
      - andesstay.commands
      - andesstay.events
      - andesstay.dlx
      - notify.email.q
      - notify.email.dlq
      - catalog.housekeeping.q
      - catalog.housekeeping.dlq
      - report.voucher.q
      - report.voucher.dlq
      - audit.reservation.q
      - audit.reservation.dlq

# Tokens are accepted only when intended for AndesStay API.
andesstay-security:
  allowed-audiences: ${AZURE_ALLOWED_AUDIENCES:85237aa5-9ece-48d3-8767-9698df0efefa,api://85237aa5-9ece-48d3-8767-9698df0efefa}
